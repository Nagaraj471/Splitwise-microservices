spring.application.name=expense-service
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.sliding-window-size=10
resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.failureRateThreshold=50
resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.permittedNumberOfCallsInHalfOpenState=2
resilience4j.timelimiter.instances.GroupServiceClientvalidateMembersLongValidateGroupRequest.timeoutDuration=5s

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
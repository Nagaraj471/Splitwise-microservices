spring.application.name=expense-service
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.slidingWindowSize=5
resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.failureRateThreshold=50
resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.GroupClientgetGroupLong.permittedNumberOfCallsInHalfOpenState=2

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
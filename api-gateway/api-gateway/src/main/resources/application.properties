spring.application.name=api-gateway
server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Group Service route
spring.cloud.gateway.server.webflux.routes[0].id=group-service

spring.cloud.gateway.server.webflux.routes[0].uri=lb://GROUP-SERVICE

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/groups/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=gateway
management.endpoint.gateway.access=read-only

# Expense Service route
spring.cloud.gateway.server.webflux.routes[1].id=expense-service

spring.cloud.gateway.server.webflux.routes[1].uri=lb://EXPENSE-SERVICE

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/expenses/**

spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1